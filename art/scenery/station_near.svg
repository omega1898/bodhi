<?xml version="1.0" encoding="UTF-8"?>
<!-- Purpose: chapter one's nearest background layer: heavy riveted iron columns and braces
     just behind the platforms. The game draws it at half resolution, so it sits softly out of
     focus behind the characters. One 1600-wide tile, repeated sideways. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800">
  <defs>
    <linearGradient id="column" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a3644"/><stop offset="0.35" stop-color="#18212b"/><stop offset="1" stop-color="#0e141a"/>
    </linearGradient>
    <linearGradient id="brace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2631"/><stop offset="1" stop-color="#111820"/>
    </linearGradient>
  </defs>
  <!-- A big column with a curved knee brace, and a second one further along. -->
  <g>
    <rect x="220" y="0" width="64" height="800" fill="url(#column)"/>
    <rect x="206" y="560" width="92" height="30" fill="#141b23"/>
    <path d="M 284,120 C 380,130 470,170 540,250 L 540,276 C 470,196 380,156 284,148 Z" fill="url(#brace)"/>
    <path d="M 284,120 C 380,130 470,170 540,250" fill="none" stroke="#4d6378" stroke-width="2" opacity="0.4"/>
    <rect x="226" y="0" width="5" height="800" fill="#56718c" opacity="0.35"/>
    <g fill="#3a4b5c" opacity="0.7">
      <circle cx="240" cy="60" r="3.5"/><circle cx="264" cy="60" r="3.5"/><circle cx="240" cy="200" r="3.5"/><circle cx="264" cy="200" r="3.5"/>
      <circle cx="240" cy="340" r="3.5"/><circle cx="264" cy="340" r="3.5"/><circle cx="240" cy="480" r="3.5"/><circle cx="264" cy="480" r="3.5"/>
    </g>
  </g>
  <g>
    <rect x="1180" y="0" width="52" height="800" fill="url(#column)"/>
    <path d="M 1180,90 C 1100,100 1030,140 980,200 L 980,222 C 1030,164 1100,124 1180,116 Z" fill="url(#brace)"/>
    <rect x="1186" y="0" width="4" height="800" fill="#56718c" opacity="0.3"/>
  </g>
  <!-- A cable hanging from the dark, with a lamp that went out long ago. -->
  <path d="M 760,0 L 760,180" stroke="#141b23" stroke-width="4"/>
  <path d="M 736,180 L 784,180 L 772,196 L 748,196 Z" fill="#141b23"/>
</svg>
