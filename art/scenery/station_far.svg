<?xml version="1.0" encoding="UTF-8"?>
<!-- Purpose: chapter one's farthest background layer: the flooded city at night, seen through
     the rain past the station. One 1600-wide tile; the game repeats it sideways. The sky is
     left transparent: the game paints the sky gradient behind this layer.
     Horizon (the water line) is at y = 500. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800">
  <defs>
    <linearGradient id="far_block" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c3a4c"/><stop offset="1" stop-color="#202b39"/>
    </linearGradient>
    <linearGradient id="near_block" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2533"/><stop offset="1" stop-color="#141c27"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7b90aa" stop-opacity="0"/><stop offset="1" stop-color="#7b90aa" stop-opacity="0.38"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26364a"/><stop offset="0.35" stop-color="#162130"/><stop offset="1" stop-color="#0a1018"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <filter id="reflection_blur" x="-50%" y="-10%" width="200%" height="120%"><feGaussianBlur stdDeviation="3 6"/></filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>

  <!-- The farthest blocks, pale with distance and rain. -->
  <g fill="url(#far_block)" opacity="0.85" filter="url(#soft)">
    <path d="M 0,500 L 0,300 L 70,300 L 70,270 L 150,270 L 150,320 L 230,320 L 230,250 L 260,250 L 260,230 L 290,230 L 290,250 L 330,250 L 330,310 L 420,310 L 420,280 L 520,280 L 520,330 L 600,330 L 600,260 L 640,240 L 680,260 L 680,300 L 760,300 L 760,270 L 860,270 L 860,320 L 960,320 L 960,240 L 1000,240 L 1000,215 L 1012,190 L 1024,215 L 1024,240 L 1060,240 L 1060,300 L 1150,300 L 1150,280 L 1240,280 L 1240,320 L 1320,320 L 1320,260 L 1420,260 L 1420,300 L 1500,300 L 1500,280 L 1600,280 L 1600,500 Z"/>
  </g>
  <rect x="0" y="380" width="1600" height="120" fill="url(#haze)"/>

  <!-- Nearer blocks: taller and darker, with rooftop shapes that give the city a character. -->
  <g fill="url(#near_block)">
    <path d="M 0,500 L 0,360 L 90,360 L 90,330 L 180,330 L 180,500 Z"/>
    <path d="M 210,500 L 210,300 L 330,300 L 330,500 Z"/>
    <g transform="translate(270,300)">
      <rect x="-28" y="-62" width="56" height="44" rx="6"/>
      <path d="M -24,-18 L -30,0 M 24,-18 L 30,0 M 0,-18 L 0,0" stroke="#1b2533" stroke-width="5"/>
      <path d="M -30,-62 L 0,-80 L 30,-62 Z"/>
    </g>
    <path d="M 360,500 L 360,340 L 470,340 L 470,320 L 500,320 L 500,500 Z"/>
    <path d="M 540,500 L 540,250 L 610,250 L 610,230 L 640,230 L 640,500 Z"/>
    <path d="M 588,230 L 588,180 L 594,180 L 594,230 Z"/>
    <path d="M 680,500 L 680,350 L 820,350 L 820,500 Z"/>
    <path d="M 850,500 L 850,290 L 930,290 L 930,500 Z"/>
    <path d="M 970,500 L 970,320 L 1040,320 L 1040,250 L 1060,210 L 1080,250 L 1080,320 L 1110,320 L 1110,500 Z"/>
    <path d="M 1060,210 L 1060,150 L 1063,150 L 1063,210 Z"/>
    <path d="M 1150,500 L 1150,360 L 1260,360 L 1260,330 L 1300,330 L 1300,500 Z"/>
    <path d="M 1330,500 L 1330,280 L 1440,280 L 1440,500 Z"/>
    <path d="M 1480,500 L 1480,340 L 1600,340 L 1600,500 Z"/>
  </g>
  <!-- A few windows still lit: someone, somewhere, is still here. -->
  <g fill="#f2b45f">
    <rect x="232" y="330" width="8" height="11"/><rect x="290" y="392" width="8" height="11"/><rect x="562" y="282" width="8" height="11"/>
    <rect x="604" y="344" width="8" height="11"/><rect x="872" y="316" width="8" height="11"/><rect x="1000" y="352" width="8" height="11"/>
    <rect x="1350" y="304" width="8" height="11"/><rect x="1412" y="372" width="8" height="11"/><rect x="128" y="382" width="8" height="11"/>
  </g>
  <g fill="#f2b45f" opacity="0.5" filter="url(#glow)">
    <rect x="228" y="326" width="16" height="19"/><rect x="558" y="278" width="16" height="19"/><rect x="868" y="312" width="16" height="19"/>
    <rect x="1346" y="300" width="16" height="19"/>
  </g>
  <g fill="#9fb6d4" opacity="0.6">
    <rect x="720" y="400" width="7" height="10"/><rect x="1200" y="390" width="7" height="10"/><rect x="400" y="380" width="7" height="10"/>
  </g>
  <rect x="0" y="440" width="1600" height="62" fill="url(#haze)"/>

  <!-- The flood: dark water, the city's lights smeared down into it, faint ripple lines. -->
  <rect x="0" y="500" width="1600" height="300" fill="url(#water)"/>
  <g filter="url(#reflection_blur)" opacity="0.55">
    <rect x="232" y="510" width="8" height="70" fill="#f2b45f"/><rect x="562" y="510" width="8" height="90" fill="#f2b45f"/>
    <rect x="872" y="510" width="8" height="80" fill="#f2b45f"/><rect x="1000" y="510" width="8" height="60" fill="#f2b45f"/>
    <rect x="1350" y="510" width="8" height="85" fill="#f2b45f"/><rect x="128" y="510" width="8" height="50" fill="#f2b45f"/>
    <rect x="720" y="510" width="7" height="50" fill="#9fb6d4"/><rect x="1200" y="510" width="7" height="55" fill="#9fb6d4"/>
  </g>
  <g stroke="#8ea6c2" stroke-width="1.5" opacity="0.22" stroke-linecap="round">
    <path d="M 40,520 L 180,520 M 300,532 L 520,532 M 640,516 L 760,516 M 900,540 L 1120,540 M 1240,524 L 1400,524 M 1460,548 L 1580,548"/>
    <path d="M 120,560 L 260,560 M 420,576 L 600,576 M 760,568 L 940,568 M 1080,590 L 1300,590 M 1380,610 L 1540,610"/>
  </g>
</svg>
