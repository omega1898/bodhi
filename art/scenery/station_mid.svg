<?xml version="1.0" encoding="UTF-8"?>
<!-- Purpose: chapter one's middle background layer: the great iron-and-glass station roof,
     some panes broken, a clock still hanging from the arch. One 1600-wide tile (two arches)
     that the game repeats sideways. Transparent where you can see through to the city. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800">
  <defs>
    <linearGradient id="iron" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#26323e"/><stop offset="0.5" stop-color="#1a232d"/><stop offset="1" stop-color="#121920"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fb6cf" stop-opacity="0.22"/><stop offset="1" stop-color="#6f88a6" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="hall_haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6e86a2" stop-opacity="0"/><stop offset="1" stop-color="#6e86a2" stop-opacity="0.22"/>
    </linearGradient>
    <radialGradient id="clock_face" cx="0.45" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#e9e2cf"/><stop offset="1" stop-color="#b9b19c"/>
    </radialGradient>
  </defs>

  <!-- Two arches per tile. Glass first, then the iron frame over it. -->
  <g id="arch">
    <path d="M 20,330 C 20,120 200,40 400,40 C 600,40 780,120 780,330 Z" fill="url(#glass)"/>
    <!-- Broken panes: dark gaps where the glass is gone. -->
    <path d="M 250,90 L 330,62 L 340,140 L 262,160 Z" fill="#0b1118" opacity="0.55"/>
    <path d="M 560,110 L 640,140 L 618,210 L 548,186 Z" fill="#0b1118" opacity="0.5"/>
    <g stroke="#1a232d" stroke-width="5" fill="none">
      <path d="M 400,40 L 400,330 M 400,40 L 160,330 M 400,40 L 640,330 M 400,40 L 60,250 M 400,40 L 740,250"/>
      <path d="M 70,240 C 120,150 260,96 400,96 C 540,96 680,150 730,240"/>
      <path d="M 40,300 C 90,190 250,150 400,150 C 550,150 710,190 760,300"/>
    </g>
    <path d="M 20,330 C 20,120 200,40 400,40 C 600,40 780,120 780,330" fill="none" stroke="url(#iron)" stroke-width="18"/>
    <path d="M 44,330 C 44,140 210,64 400,64 C 590,64 756,140 756,330" fill="none" stroke="#1d2731" stroke-width="7"/>
    <path d="M 28,322 C 30,140 200,52 400,50" fill="none" stroke="#5d7790" stroke-width="2.5" opacity="0.45"/>
  </g>
  <use href="#arch" x="800"/>

  <!-- The tie beam and the columns that carry the roof down to the platforms. -->
  <rect x="0" y="322" width="1600" height="18" fill="#161e27"/>
  <rect x="0" y="322" width="1600" height="3" fill="#4f6780" opacity="0.5"/>
  <g fill="url(#iron)">
    <rect x="-14" y="330" width="34" height="470"/><rect x="786" y="330" width="34" height="470"/><rect x="1586" y="330" width="34" height="470"/>
  </g>
  <g fill="#202b36">
    <rect x="-24" y="330" width="54" height="20"/><rect x="776" y="330" width="54" height="20"/><rect x="1576" y="330" width="54" height="20"/>
  </g>
  <g fill="#3c4f63" opacity="0.6">
    <circle cx="3" cy="380" r="3"/><circle cx="3" cy="440" r="3"/><circle cx="3" cy="500" r="3"/>
    <circle cx="803" cy="380" r="3"/><circle cx="803" cy="440" r="3"/><circle cx="803" cy="500" r="3"/>
  </g>

  <!-- The station clock, stopped, hanging from the first arch. -->
  <g transform="translate(400,250)">
    <rect x="-3" y="-160" width="6" height="128" fill="#161e27"/>
    <circle cx="0" cy="0" r="40" fill="#161e27"/>
    <circle cx="0" cy="0" r="33" fill="url(#clock_face)"/>
    <g stroke="#2a2a28" stroke-width="2.5" stroke-linecap="round">
      <path d="M 0,-27 L 0,-22 M 0,27 L 0,22 M -27,0 L -22,0 M 27,0 L 22,0"/>
      <path d="M 0,0 L 12,-14" stroke-width="3.5"/>
      <path d="M 0,0 L -4,-24"/>
    </g>
    <circle cx="0" cy="0" r="3" fill="#2a2a28"/>
  </g>

  <!-- A platform board hanging from the second arch. -->
  <g transform="translate(1200,360)">
    <path d="M -90,-40 L -90,-8 M 90,-40 L 90,-8" stroke="#161e27" stroke-width="4"/>
    <rect x="-110" y="-8" width="220" height="48" rx="4" fill="#1f3a34"/>
    <rect x="-104" y="-2" width="208" height="36" rx="2" fill="none" stroke="#d9cfb3" stroke-width="1.5" opacity="0.5"/>
    <text x="0" y="23" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="18" letter-spacing="3" fill="#d9cfb3">PLATFORMS 1 – 4</text>
  </g>

  <rect x="0" y="420" width="1600" height="380" fill="url(#hall_haze)"/>
</svg>
