<?xml version="1.0" encoding="UTF-8"?>
<!-- Purpose: the woman, painted as separate body parts for cut-out animation. Each part is a
     group named part_*. The point the part rotates around (its joint) is the group's origin:
     the place its translate(...) moves to. Limbs hang straight down from their joint, so the
     game can rotate each one along a bone. Scale: 10 drawing units = 1 game unit.
     Light: warm key light from the front and above; cool rim light from behind.
     Edit freely in Figma, Illustrator or Inkscape; keep the part names and the joint origins,
     then run art/tools/build_atlas.js. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="860" viewBox="0 0 1100 860">
  <defs>
    <!-- Fine paper-like grain, multiplied over every part so flat colour reads as painted. -->
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="4" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="faint"><feFuncA type="table" tableValues="0 0.16"/></feComponentTransfer>
      <feComposite in="faint" in2="SourceGraphic" operator="in" result="grain_on_shape"/>
      <feBlend in="grain_on_shape" in2="SourceGraphic" mode="multiply"/>
    </filter>
    <linearGradient id="skin" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8dfca"/><stop offset="0.55" stop-color="#efcbb0"/><stop offset="1" stop-color="#d9a98c"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7e3a6"/><stop offset="0.5" stop-color="#e2bd69"/><stop offset="1" stop-color="#b48c43"/>
    </linearGradient>
    <linearGradient id="ponytail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9c878"/><stop offset="1" stop-color="#a98339"/>
    </linearGradient>
    <linearGradient id="coat" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b9590"/><stop offset="0.45" stop-color="#2f6c69"/><stop offset="1" stop-color="#1b4544"/>
    </linearGradient>
    <linearGradient id="sleeve" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#46908b"/><stop offset="1" stop-color="#22504e"/>
    </linearGradient>
    <linearGradient id="scarf" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8693a"/><stop offset="1" stop-color="#8a361a"/>
    </linearGradient>
    <linearGradient id="jeans" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#40507a"/><stop offset="1" stop-color="#252e45"/>
    </linearGradient>
    <linearGradient id="leather" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#55402f"/><stop offset="1" stop-color="#2e2017"/>
    </linearGradient>
    <linearGradient id="bag" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a6a46"/><stop offset="1" stop-color="#5a432c"/>
    </linearGradient>
    <radialGradient id="blush" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8857a" stop-opacity="0.38"/><stop offset="1" stop-color="#e8857a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- HEAD: joint at the base of the neck. -->
  <g id="part_head" transform="translate(140,260)" filter="url(#grain)">
    <path d="M -26,14 C -24,-18 -22,-38 -18,-48 L 30,-48 C 32,-30 34,-12 38,14 Z" fill="#dcae92"/>
    <path d="M -30,-40 C -70,-60 -88,-110 -80,-150 C -72,-192 -20,-205 20,-200 C 60,-196 84,-170 86,-136 C 87,-124 84,-114 88,-106 C 90,-100 96,-94 104,-84 C 108,-79 103,-73 94,-73 C 92,-70 92,-67 94,-64 C 98,-62 97,-57 92,-55 C 96,-52 95,-46 90,-44 C 92,-36 88,-28 78,-24 C 62,-18 40,-24 24,-34 C 10,-42 -10,-40 -30,-40 Z" fill="url(#skin)"/>
    <path d="M 24,-34 C 40,-26 62,-20 78,-24 C 70,-30 50,-34 36,-40 Z" fill="#cf9d80" opacity="0.6"/>
    <circle cx="58" cy="-68" r="22" fill="url(#blush)"/>
    <ellipse cx="-8" cy="-98" rx="13" ry="21" fill="#e4b49a"/>
    <ellipse cx="-6" cy="-96" rx="6" ry="12" fill="#c98f74"/>
    <path d="M 52,-103 C 58,-110 70,-110 77,-104 C 70,-98 58,-98 52,-103 Z" fill="#fbf6f0"/>
    <circle cx="68" cy="-104" r="6.5" fill="#3f78b8"/>
    <circle cx="68" cy="-104" r="6.5" fill="none" stroke="#24466d" stroke-width="1.5"/>
    <circle cx="69" cy="-104" r="3" fill="#162033"/>
    <circle cx="71" cy="-106.5" r="1.7" fill="#ffffff"/>
    <path d="M 49,-104 C 57,-115 72,-114 80,-105" fill="none" stroke="#4a3326" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 79,-106 L 85,-110 M 76,-109 L 80,-114" stroke="#4a3326" stroke-width="2" stroke-linecap="round"/>
    <path d="M 46,-124 C 58,-132 74,-131 85,-124" fill="none" stroke="#b08640" stroke-width="5" stroke-linecap="round"/>
    <path d="M 96,-78 C 99,-76 99,-74 96,-73" fill="none" stroke="#b98468" stroke-width="2" stroke-linecap="round"/>
    <path d="M 88,-59 C 92,-58 95,-56 94,-54 C 93,-50 90,-48 87,-49 C 89,-52 89,-56 88,-59 Z" fill="#c97a6c"/>
    <!-- Hair: a soft mass over the top and back, a swept fringe, and highlights. -->
    <path d="M 84,-140 C 82,-176 50,-206 6,-206 C -50,-206 -92,-170 -92,-118 C -92,-82 -78,-56 -56,-40 C -50,-60 -40,-78 -22,-84 C -14,-104 -10,-128 4,-140 C 24,-152 52,-150 84,-140 Z" fill="url(#hair)"/>
    <path d="M 88,-144 C 76,-128 58,-120 34,-122 C 50,-134 62,-152 84,-162 Z" fill="#d5ac58"/>
    <path d="M -64,-168 C -36,-196 18,-200 58,-182 M -80,-128 C -66,-168 -24,-190 22,-188 M -84,-96 C -84,-130 -60,-160 -26,-172" fill="none" stroke="#fff6d8" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <path d="M -70,-70 C -78,-100 -70,-130 -50,-150 M -40,-90 C -36,-120 -16,-140 10,-150" fill="none" stroke="#9e7a35" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M -92,-118 C -92,-82 -78,-56 -56,-40" fill="none" stroke="#bcd6ef" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
    <ellipse cx="-78" cy="-148" rx="9" ry="12" fill="#8c3a1d" transform="rotate(-30 -78 -148)"/>
  </g>

  <!-- PONYTAIL: joint at the hair tie; it hangs down and swings on a spring. -->
  <g id="part_ponytail" transform="translate(360,60)" filter="url(#grain)">
    <path d="M -14,-6 C -40,30 -50,90 -30,150 C -22,172 -8,186 4,190 C -6,160 4,110 20,60 C 26,30 20,6 12,-6 Z" fill="url(#ponytail)"/>
    <path d="M -4,10 C -24,50 -30,110 -14,160 M 8,20 C -6,60 -6,110 0,160" fill="none" stroke="#fff3cf" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M -30,150 C -22,172 -8,186 4,190" fill="none" stroke="#bcd6ef" stroke-width="3" opacity="0.5"/>
  </g>

  <!-- TORSO: the raincoat, joint at the hip; the shoulders sit straight above at y = -275. -->
  <g id="part_torso" transform="translate(600,360)" filter="url(#grain)">
    <path d="M -60,-270 C -76,-290 -40,-302 -10,-292 C 10,-286 0,-270 -20,-262 Z" fill="#1f4c4b"/>
    <path d="M -58,-268 C -30,-284 30,-286 58,-272 C 74,-262 80,-236 78,-200 C 76,-170 70,-140 66,-112 C 74,-70 88,-10 100,96 C 60,104 -40,108 -110,100 C -96,20 -84,-60 -76,-112 C -80,-160 -80,-220 -58,-268 Z" fill="url(#coat)"/>
    <path d="M 44,-262 C 56,-180 66,-60 84,96" fill="none" stroke="#123332" stroke-width="3" opacity="0.6"/>
    <path d="M -76,-118 C -20,-110 30,-108 68,-114 L 66,-96 C 30,-90 -20,-92 -78,-100 Z" fill="#214d4c"/>
    <path d="M 46,-112 C 58,-120 66,-114 60,-104 C 70,-96 66,-86 54,-94 C 50,-80 40,-84 44,-96 Z" fill="#1b4140"/>
    <g fill="#163837"><circle cx="54" cy="-228" r="6"/><circle cx="58" cy="-176" r="6"/><circle cx="64" cy="-56" r="6"/><circle cx="70" cy="-4" r="6"/></g>
    <g fill="#6fb3ad" opacity="0.6"><circle cx="52" cy="-230" r="2"/><circle cx="56" cy="-178" r="2"/><circle cx="62" cy="-58" r="2"/><circle cx="68" cy="-6" r="2"/></g>
    <path d="M 20,-40 L 64,-46 L 66,-30 L 22,-24 Z" fill="#1d4847"/>
    <path d="M -40,-60 C -30,0 -40,50 -50,96 M 10,-80 C 20,-20 30,40 40,100 M -20,-200 C -10,-170 -10,-150 -16,-130" fill="none" stroke="#0f2a29" stroke-width="3" opacity="0.35" stroke-linecap="round"/>
    <path d="M 60,-262 C 74,-240 78,-210 74,-180" fill="none" stroke="#8fd0c8" stroke-width="4" opacity="0.45" stroke-linecap="round"/>
    <path d="M -58,-268 C -80,-220 -80,-160 -76,-112 C -84,-60 -96,20 -110,100" fill="none" stroke="#a9d3e6" stroke-width="5" opacity="0.45" stroke-linecap="round"/>
    <path d="M 58,-262 L -66,-96" stroke="#4b3a27" stroke-width="9" stroke-linecap="round"/>
    <path d="M 56,-260 L -64,-98" stroke="#6e5638" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
    <!-- The rust scarf, wrapped twice round the neck. -->
    <path d="M -46,-292 C -20,-312 40,-308 64,-284 C 68,-270 56,-256 40,-254 C 10,-250 -30,-254 -50,-268 Z" fill="url(#scarf)"/>
    <path d="M -36,-286 C -6,-300 30,-298 54,-280 M -40,-270 C -10,-262 24,-262 50,-266" fill="none" stroke="#6e2a14" stroke-width="3" opacity="0.6" stroke-linecap="round"/>
    <path d="M -20,-302 C 10,-310 40,-302 58,-290" fill="none" stroke="#f0915e" stroke-width="3" opacity="0.6" stroke-linecap="round"/>
  </g>

  <!-- SCARF TAIL: joint at the back of the neck; it streams behind her. -->
  <g id="part_scarf_tail" transform="translate(820,60)" filter="url(#grain)">
    <path d="M -14,-4 C -30,30 -40,90 -36,150 L -6,156 C -10,110 -2,50 14,4 Z" fill="url(#scarf)"/>
    <path d="M -34,150 L -36,166 M -26,152 L -26,168 M -16,153 L -14,168 M -8,154 L -5,168" stroke="#8a361a" stroke-width="3" stroke-linecap="round"/>
    <path d="M -20,20 C -28,60 -30,100 -26,140" fill="none" stroke="#6e2a14" stroke-width="2.5" opacity="0.5"/>
  </g>

  <!-- BAG: joint where the strap meets the satchel. -->
  <g id="part_bag" transform="translate(980,60)" filter="url(#grain)">
    <path d="M -55,0 C -58,60 -52,110 -40,120 L 40,120 C 52,110 56,60 54,0 Z" fill="url(#bag)"/>
    <path d="M -58,-4 L 56,-4 L 52,60 C 20,74 -20,74 -54,60 Z" fill="#7c6143"/>
    <path d="M -50,56 C -20,68 20,68 48,56" fill="none" stroke="#4e3a26" stroke-width="3"/>
    <rect x="-9" y="44" width="18" height="16" rx="3" fill="#c9a45a"/>
    <rect x="-5" y="48" width="10" height="8" rx="2" fill="#7c6143"/>
  </g>

  <!-- UPPER ARM: joint at the shoulder; the elbow is at y = 140. -->
  <g id="part_upper_arm" transform="translate(120,560)" filter="url(#grain)">
    <path d="M -26,-6 C -30,-28 28,-30 28,-4 C 30,40 26,100 22,140 L -22,140 C -26,100 -28,40 -26,-6 Z" fill="url(#sleeve)"/>
    <path d="M -12,104 C 0,110 10,112 18,108 M -16,124 C -4,130 8,130 18,126" fill="none" stroke="#123332" stroke-width="3" opacity="0.45" stroke-linecap="round"/>
    <path d="M 26,-4 C 28,40 24,100 20,136" fill="none" stroke="#8fd0c8" stroke-width="3" opacity="0.4"/>
  </g>

  <!-- FOREARM AND HAND: joint at the elbow; the wrist is at y = 130. -->
  <g id="part_forearm" transform="translate(260,560)" filter="url(#grain)">
    <path d="M -22,-4 L 22,-4 C 22,40 20,90 20,118 L -20,118 C -21,90 -22,40 -22,-4 Z" fill="url(#sleeve)"/>
    <path d="M -21,102 L 21,102 L 21,122 L -21,122 Z" fill="#1f4c4b"/>
    <path d="M -16,118 C -18,140 -14,165 2,170 C 16,172 22,155 20,130 L 18,118 Z" fill="url(#skin)"/>
    <path d="M 14,128 C 24,132 26,146 18,150 Z" fill="#e2b498"/>
    <path d="M -6,150 C -2,158 6,162 12,160" fill="none" stroke="#c99a80" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- THIGH: joint at the hip; the knee is at y = 230. -->
  <g id="part_thigh" transform="translate(420,580)" filter="url(#grain)">
    <path d="M -40,-10 C -42,60 -36,160 -30,232 L 30,232 C 34,160 42,60 42,-10 Z" fill="url(#jeans)"/>
    <path d="M 8,0 C 10,80 10,160 6,230" fill="none" stroke="#1a2030" stroke-width="2.5" opacity="0.5"/>
    <ellipse cx="14" cy="212" rx="14" ry="20" fill="#5a6c96" opacity="0.35"/>
  </g>

  <!-- SHIN AND BOOT SHAFT: joint at the knee; the ankle is at y = 220. -->
  <g id="part_shin" transform="translate(580,580)" filter="url(#grain)">
    <path d="M -30,-4 L 31,-4 C 30,60 26,140 24,170 L -24,170 C -26,140 -30,60 -30,-4 Z" fill="url(#jeans)"/>
    <path d="M -27,158 L 27,158 L 26,222 L -26,222 Z" fill="url(#leather)"/>
    <path d="M -27,158 L 27,158 L 27,166 L -27,166 Z" fill="#6b5039"/>
    <path d="M 22,170 C 24,190 24,206 22,220" fill="none" stroke="#8a6c50" stroke-width="2.5" opacity="0.6"/>
  </g>

  <!-- BOOT: joint at the ankle; the foot points forward and stays nearly level. -->
  <g id="part_boot" transform="translate(760,620)" filter="url(#grain)">
    <path d="M -28,-6 L 26,-6 C 40,0 66,8 76,20 C 80,28 78,36 70,36 L -30,36 C -34,24 -34,8 -28,-6 Z" fill="url(#leather)"/>
    <path d="M -32,30 L 74,30 L 72,40 L -32,40 Z" fill="#1c140e"/>
    <path d="M 20,2 L 34,8 M 28,6 L 42,12" stroke="#7a5d42" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 30,4 C 50,10 64,16 72,22" fill="none" stroke="#7a5d42" stroke-width="2" opacity="0.6"/>
  </g>
</svg>
